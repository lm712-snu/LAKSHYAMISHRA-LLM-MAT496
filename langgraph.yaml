# LangGraph-style pseudoyaml for AuralMind 2.0 (agent definitions & edges)
globals:
  embedding_dims:
    audio: 512
    lyrics: 384
    meta: 128
    fused: 1024
  vector_db: chroma://localhost:8000/index/auralmind_tracks

nodes:
  - name: intent_router
    type: llm_chain
    description: Classify user intent and generate agent routing plan.

  - name: spotify_agent
    type: io_agent
    description: Fetch normalized metadata + audio_features for queries or track ids.

  - name: youtube_agent
    type: io_agent
    description: Fetch metadata and captions for YouTube content.

  - name: lyrics_agent
    type: io_llm_pipeline
    description: Fetch lyrics and extract themes + embedding.

  - name: audio_agent
    type: processing_agent
    description: Extract audio features and audio_embedding from preview or upload.

  - name: embedding_composer
    type: fusion_agent
    description: Fuse audio, lyrics, and metadata embeddings into fused vector.

  - name: recommendation_agent
    type: retrieval_agent
    description: Nearest-neighbor retrieval + reranking + diversity heuristics.

  - name: generation_agent
    type: external_model_agent
    description: Optional: call Riffusion/Suno to generate short audio samples.

  - name: explanation_agent
    type: llm_chain
    description: Produce human-friendly explanations for recommendations.

  - name: synthesizer_agent
    type: aggregator
    description: Build final UI payload for frontend.

edges:
  - from: user_input
    to: intent_router
  - from: intent_router
    to: spotify_agent
    condition: intent in [search, recommend]
  - from: spotify_agent
    to: lyrics_agent
    on: track_found
  - from: spotify_agent
    to: audio_agent
    on: track_preview_available
  - from: lyrics_agent
    to: embedding_composer
  - from: audio_agent
    to: embedding_composer
  - from: embedding_composer
    to: recommendation_agent
  - from: recommendation_agent
    to: explanation_agent
  - from: recommendation_agent
    to: synthesizer_agent
  - from: generation_agent
    to: synthesizer_agent
  - from: synthesizer_agent
    to: frontend
